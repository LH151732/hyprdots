source = ~/.config/hypr/themes/colors.conf

general {
    grace = 300
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# 时间
label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = Inter Bold
    color = rgba(ebdbb2ff)
    position = 0, 200
    halign = center
    valign = center
}

# 日期
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %e"
    font_size = 24
    font_family = Inter
    color = rgba(a89984ff)
    position = 0, 100
    halign = center
    valign = center
}

# 输入框
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(1d2021ff)
    inner_color = rgba(282828ff)
    font_color = rgba(ebdbb2ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(98971aff)
    fail_color = rgba(cc241dff)
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(d79921ff)
    position = 0, -50
    halign = center
    valign = center
    rounding = 10
}
