[mgr]

keymap = [
	{ on = "<Esc>", run = "escape",             desc = "退出可视模式、清除选中或取消搜索" },
	{ on = "<C-[>", run = "escape",             desc = "退出可视模式、清除选中或取消搜索" },
	{ on = "q",     run = "quit",               desc = "退出程序" },
	{ on = "Q",     run = "quit --no-cwd-file", desc = "退出但不输出当前目录文件" },
	{ on = "<C-c>", run = "close",              desc = "关闭当前标签页,若为最后一个则退出" },
	{ on = "<C-z>", run = "suspend",            desc = "挂起进程" },

	# 光标移动
	{ on = "k", run = "arrow prev", desc = "上一个文件" },
	{ on = "j", run = "arrow next", desc = "下一个文件" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个文件" },
	{ on = "<Down>", run = "arrow next", desc = "下一个文件" },

	{ on = "<C-u>", run = "arrow -50%",  desc = "向上移动半页" },
	{ on = "<C-d>", run = "arrow 50%",   desc = "向下移动半页" },
	{ on = "<C-b>", run = "arrow -100%", desc = "向上移动一页" },
	{ on = "<C-f>", run = "arrow 100%",  desc = "向下移动一页" },

	{ on = "<S-PageUp>",   run = "arrow -50%",  desc = "向上移动半页" },
	{ on = "<S-PageDown>", run = "arrow 50%",   desc = "向下移动半页" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "向上移动一页" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "向下移动一页" },

	{ on = [ "g", "g" ], run = "arrow top", desc = "跳到顶部" },
	{ on = "G",          run = "arrow bot", desc = "跳到底部" },

	# 目录导航
	{ on = "h", run = "leave", desc = "返回上级目录" },
	{ on = "l", run = "enter", desc = "进入子目录" },

	{ on = "<Left>",  run = "leave", desc = "返回上级目录" },
	{ on = "<Right>", run = "enter", desc = "进入子目录" },

	{ on = "H", run = "back",    desc = "返回上一个目录" },
	{ on = "L", run = "forward", desc = "前进到下一个目录" },

	# 选择
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "切换当前文件的选中状态" },
	{ on = "<C-a>",   run = "toggle_all --state=on", desc = "全选文件" },
	{ on = "<C-r>",   run = "toggle_all",            desc = "反选所有文件" },

	# 可视模式
	{ on = "v", run = "visual_mode",         desc = "进入可视模式(选择模式)" },
	{ on = "V", run = "visual_mode --unset", desc = "进入可视模式(取消选择模式)" },

	# 预览滚动
	{ on = "K", run = "seek -5", desc = "预览向上滚动 5 行" },
	{ on = "J", run = "seek 5",  desc = "预览向下滚动 5 行" },

	# 快速预览
	{ on = "<Tab>", run = "spot", desc = "快速预览当前文件" },

	# 文件操作
	{ on = "o",         run = "open",                        desc = "打开所选文件" },
	{ on = "O",         run = "open --interactive",          desc = "交互式打开所选文件" },
	{ on = "<Enter>",   run = "open",                        desc = "打开所选文件" },
	{ on = "<S-Enter>", run = "open --interactive",          desc = "交互式打开所选文件" },
	{ on = "y",         run = "yank",                        desc = "复制所选文件" },
	{ on = "x",         run = "yank --cut",                  desc = "剪切所选文件" },
	{ on = "p",         run = "paste",                       desc = "粘贴已复制/剪切的文件" },
	{ on = "P",         run = "plugin rsync-paste",           desc = "使用 rsync 粘贴(支持 SFTP)" },
	{ on = "-",         run = "link",                        desc = "创建已复制文件的绝对路径符号链接" },
	{ on = "_",         run = "link --relative",             desc = "创建已复制文件的相对路径符号链接" },
	{ on = "<C-->",     run = "hardlink",                    desc = "创建已复制文件的硬链接" },
	{ on = "Y",         run = "unyank",                      desc = "取消复制/剪切状态" },
	{ on = "X",         run = "unyank",                      desc = "取消复制/剪切状态" },
	{ on = "d",         run = "remove",                      desc = "移到回收站" },
	{ on = "D",         run = "remove --permanently",        desc = "永久删除所选文件" },
	{ on = "a",         run = "create",                      desc = "创建文件(以 / 结尾则创建目录)" },
	{ on = "r",         run = "rename --cursor=before_ext",  desc = "重命名所选文件" },
	{ on = ";",         run = "shell --interactive",         desc = "运行 shell 命令" },
	{ on = ":",         run = "shell --block --interactive", desc = "运行 shell 命令(等待完成)" },
	{ on = ".",         run = "hidden toggle",               desc = "切换隐藏文件可见性" },
	{ on = "s",         run = "search --via=fd",             desc = "通过 fd 按文件名搜索" },
	{ on = "S",         run = "search --via=rg",             desc = "通过 ripgrep 按文件内容搜索" },
	{ on = "<C-s>",     run = "escape --search",             desc = "取消正在进行的搜索" },
	{ on = "z",         run = "plugin fzf",                  desc = "通过 fzf 跳转文件/目录" },
	{ on = "Z",         run = "plugin zoxide",               desc = "通过 zoxide 跳转目录" },

	# 行显示模式
	{ on = [ "m", "s" ], run = "linemode size",        desc = "行模式: 显示大小" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "行模式: 显示权限" },
	{ on = [ "m", "b" ], run = "linemode btime",       desc = "行模式: 显示创建时间" },
	{ on = [ "m", "m" ], run = "linemode mtime",       desc = "行模式: 显示修改时间" },
	{ on = [ "m", "o" ], run = "linemode owner",       desc = "行模式: 显示所有者" },
	{ on = [ "m", "n" ], run = "linemode none",        desc = "行模式: 不显示" },

	# 复制路径
	{ on = [ "c", "c" ], run = "copy path",             desc = "复制文件路径" },
	{ on = [ "c", "d" ], run = "copy dirname",          desc = "复制目录路径" },
	{ on = [ "c", "f" ], run = "copy filename",         desc = "复制文件名" },
	{ on = [ "c", "n" ], run = "copy name_without_ext", desc = "复制不含扩展名的文件名" },
	{ on = [ "c", "y" ], run = '''shell 'if [ -n "$SSH_TTY" ]; then printf "\033]52;c;%s\a" "$(base64 < "$1")"; elif [ "$(uname)" = "Darwin" ]; then pbcopy < "$1"; else wl-copy < "$1"; fi' --confirm''', desc = "复制文件内容到剪贴板" },

	# 过滤
	{ on = "f", run = "filter --smart", desc = "过滤文件" },

	# 查找
	{ on = "/", run = "find --smart",            desc = "向下查找文件" },
	{ on = "?", run = "find --previous --smart", desc = "向上查找文件" },
	{ on = "n", run = "find_arrow",              desc = "下一个匹配" },
	{ on = "N", run = "find_arrow --previous",   desc = "上一个匹配" },

	# 排序
	{ on = [ ",", "m" ], run = [ "sort mtime --reverse=no", "linemode mtime" ],  desc = "按修改时间排序" },
	{ on = [ ",", "M" ], run = [ "sort mtime --reverse=yes", "linemode mtime" ], desc = "按修改时间倒序排序" },
	{ on = [ ",", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ],  desc = "按创建时间排序" },
	{ on = [ ",", "B" ], run = [ "sort btime --reverse=yes", "linemode btime" ], desc = "按创建时间倒序排序" },
	{ on = [ ",", "e" ], run = "sort extension --reverse=no",                    desc = "按扩展名排序" },
	{ on = [ ",", "E" ], run = "sort extension --reverse=yes",                   desc = "按扩展名倒序排序" },
	{ on = [ ",", "a" ], run = "sort alphabetical --reverse=no",                 desc = "按字母排序" },
	{ on = [ ",", "A" ], run = "sort alphabetical --reverse=yes",                desc = "按字母倒序排序" },
	{ on = [ ",", "n" ], run = "sort natural --reverse=no",                      desc = "自然排序" },
	{ on = [ ",", "N" ], run = "sort natural --reverse=yes",                     desc = "自然倒序排序" },
	{ on = [ ",", "s" ], run = [ "sort size --reverse=no", "linemode size" ],    desc = "按大小排序" },
	{ on = [ ",", "S" ], run = [ "sort size --reverse=yes", "linemode size" ],   desc = "按大小倒序排序" },
	{ on = [ ",", "r" ], run = "sort random --reverse=no",                       desc = "随机排序" },

	# 快速跳转
	{ on = [ "g", "h" ],       run = "cd ~",                        desc = "跳转到主目录" },
	{ on = [ "g", "c" ],       run = "cd ~/.config",                desc = "跳转到 ~/.config" },
	{ on = [ "g", "d" ],       run = "cd ~/Downloads",              desc = "跳转到 ~/Downloads" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive",            desc = "交互式跳转目录" },
	{ on = [ "g", "f" ],       run = "follow",                      desc = "跟随当前符号链接" },
	{ on = [ "g", "s" ],       run = "plugin sftp",                 desc = "SFTP 新标签浏览远程服务器" },

	# 标签页
	{ on = "t", run = "tab_create --current", desc = "以当前目录新建标签页" },

	{ on = "1", run = "tab_switch 0", desc = "切换到第 1 个标签页" },
	{ on = "2", run = "tab_switch 1", desc = "切换到第 2 个标签页" },
	{ on = "3", run = "tab_switch 2", desc = "切换到第 3 个标签页" },
	{ on = "4", run = "tab_switch 3", desc = "切换到第 4 个标签页" },
	{ on = "5", run = "tab_switch 4", desc = "切换到第 5 个标签页" },
	{ on = "6", run = "tab_switch 5", desc = "切换到第 6 个标签页" },
	{ on = "7", run = "tab_switch 6", desc = "切换到第 7 个标签页" },
	{ on = "8", run = "tab_switch 7", desc = "切换到第 8 个标签页" },
	{ on = "9", run = "tab_switch 8", desc = "切换到第 9 个标签页" },

	{ on = "[", run = "tab_switch -1 --relative", desc = "切换到上一个标签页" },
	{ on = "]", run = "tab_switch 1 --relative",  desc = "切换到下一个标签页" },

	{ on = "{", run = "tab_swap -1", desc = "与上一个标签页互换位置" },
	{ on = "}", run = "tab_swap 1",  desc = "与下一个标签页互换位置" },

	# 任务管理
	{ on = "w", run = "tasks:show", desc = "显示任务管理器" },

	# 插件
	{ on = [ "c", "m" ], run = "plugin chmod",              desc = "修改所选文件权限" },
	{ on = [ "c", "p" ], run = "plugin compress",           desc = "压缩所选文件" },
	{ on = [ "c", "v" ], run = "plugin convert",            desc = "转换图片格式" },
	{ on = [ "R", "s" ], run = "plugin rsync --args=push",  desc = "Rsync 推送到远端" },
	{ on = [ "R", "r" ], run = "plugin rsync --args=pull",  desc = "Rsync 从远端拉取" },
	{ on = "+",          run = "plugin zoom --args=1",      desc = "放大预览" },
	{ on = "=",          run = "plugin zoom --args=-1",     desc = "缩小预览" },
	{ on = [ "t", "r" ], run = "plugin recycle-bin -- restore", desc = "从回收站还原" },
	{ on = [ "t", "b" ], run = "plugin recycle-bin -- browse",  desc = "浏览回收站" },
	{ on = [ "t", "c" ], run = "plugin recycle-bin -- clean",   desc = "清空回收站" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-[>", run = "close", desc = "关闭任务管理器" },
	{ on = "<C-c>", run = "close", desc = "关闭任务管理器" },
	{ on = "w",     run = "close", desc = "关闭任务管理器" },

	{ on = "k", run = "arrow prev", desc = "上一个任务" },
	{ on = "j", run = "arrow next", desc = "下一个任务" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个任务" },
	{ on = "<Down>", run = "arrow next", desc = "下一个任务" },

	{ on = "<Enter>", run = "inspect", desc = "查看任务详情" },
	{ on = "x",       run = "cancel",  desc = "取消任务" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[spot]

keymap = [
	{ on = "<Esc>", run = "close", desc = "关闭快速预览" },
	{ on = "<C-[>", run = "close", desc = "关闭快速预览" },
	{ on = "<C-c>", run = "close", desc = "关闭快速预览" },
	{ on = "<Tab>", run = "close", desc = "关闭快速预览" },

	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },
	{ on = "h", run = "swipe prev", desc = "切换到上一个文件" },
	{ on = "l", run = "swipe next", desc = "切换到下一个文件" },

	{ on = "<Up>",    run = "arrow prev", desc = "上一行" },
	{ on = "<Down>",  run = "arrow next", desc = "下一行" },
	{ on = "<Left>",  run = "swipe prev", desc = "切换到上一个文件" },
	{ on = "<Right>", run = "swipe next", desc = "切换到下一个文件" },

	# 复制
	{ on = [ "c", "c" ], run = "copy cell", desc = "复制选中单元格" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[pick]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消选择" },
	{ on = "<C-[>",   run = "close",          desc = "取消选择" },
	{ on = "<C-c>",   run = "close",          desc = "取消选择" },
	{ on = "<Enter>", run = "close --submit", desc = "确认选择" },

	{ on = "k", run = "arrow prev", desc = "上一个选项" },
	{ on = "j", run = "arrow next", desc = "下一个选项" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个选项" },
	{ on = "<Down>", run = "arrow next", desc = "下一个选项" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[input]

keymap = [
	{ on = "<C-c>",   run = "close",          desc = "取消输入" },
	{ on = "<Enter>", run = "close --submit", desc = "确认输入" },
	{ on = "<Esc>",   run = "escape",         desc = "返回普通模式或取消输入" },
	{ on = "<C-[>",   run = "escape",         desc = "返回普通模式或取消输入" },

	# 模式切换
	{ on = "i", run = "insert",                          desc = "进入插入模式" },
	{ on = "I", run = [ "move first-char", "insert" ],   desc = "跳到行首并进入插入模式" },
	{ on = "a", run = "insert --append",                 desc = "进入追加模式" },
	{ on = "A", run = [ "move eol", "insert --append" ], desc = "跳到行尾并进入追加模式" },
	{ on = "v", run = "visual",                          desc = "进入可视模式" },
	{ on = "r", run = "replace",                         desc = "替换单个字符" },

	# 选择
	{ on = "V",     run = [ "move bol", "visual", "move eol" ], desc = "从行首选到行尾" },
	{ on = "<C-A>", run = [ "move eol", "visual", "move bol" ], desc = "从行尾选到行首" },
	{ on = "<C-E>", run = [ "move bol", "visual", "move eol" ], desc = "从行首选到行尾" },

	# 字符移动
	{ on = "h",       run = "move -1", desc = "向前移动一个字符" },
	{ on = "l",       run = "move 1",  desc = "向后移动一个字符" },
	{ on = "<Left>",  run = "move -1", desc = "向前移动一个字符" },
	{ on = "<Right>", run = "move 1",  desc = "向后移动一个字符" },
	{ on = "<C-b>",   run = "move -1", desc = "向前移动一个字符" },
	{ on = "<C-f>",   run = "move 1",  desc = "向后移动一个字符" },

	# 单词移动
	{ on = "b",         run = "backward",                    desc = "移到上一个单词起始处" },
	{ on = "B",         run = "backward --far",              desc = "移到上一个 WORD 起始处" },
	{ on = "w",         run = "forward",                     desc = "移到下一个单词起始处" },
	{ on = "W",         run = "forward --far",               desc = "移到下一个 WORD 起始处" },
	{ on = "e",         run = "forward --end-of-word",       desc = "移到当前或下一个单词末尾" },
	{ on = "E",         run = "forward --far --end-of-word", desc = "移到当前或下一个 WORD 末尾" },
	{ on = "<A-b>",     run = "backward",                    desc = "移到上一个单词起始处" },
	{ on = "<A-f>",     run = "forward --end-of-word",       desc = "移到当前或下一个单词末尾" },
	{ on = "<C-Left>",  run = "backward",                    desc = "移到上一个单词起始处" },
	{ on = "<C-Right>", run = "forward --end-of-word",       desc = "移到当前或下一个单词末尾" },

	# 行移动
	{ on = "0",      run = "move bol",        desc = "移到行首" },
	{ on = "$",      run = "move eol",        desc = "移到行尾" },
	{ on = "_",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "^",      run = "move first-char", desc = "移到第一个非空白字符" },
	{ on = "<C-a>",  run = "move bol",        desc = "移到行首" },
	{ on = "<C-e>",  run = "move eol",        desc = "移到行尾" },
	{ on = "<Home>", run = "move bol",        desc = "移到行首" },
	{ on = "<End>",  run = "move eol",        desc = "移到行尾" },

	# 删除
	{ on = "<Backspace>", run = "backspace",         desc = "删除光标前的字符" },
	{ on = "<Delete>",    run = "backspace --under", desc = "删除光标下的字符" },
	{ on = "<C-h>",       run = "backspace",         desc = "删除光标前的字符" },
	{ on = "<C-d>",       run = "backspace --under", desc = "删除光标下的字符" },

	# 整段删除
	{ on = "<C-u>",         run = "kill bol",      desc = "向前删除到行首" },
	{ on = "<C-k>",         run = "kill eol",      desc = "向后删除到行尾" },
	{ on = "<C-w>",         run = "kill backward", desc = "向前删除到单词起始处" },
	{ on = "<A-d>",         run = "kill forward",  desc = "向后删除到单词末尾" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "向前删除到单词起始处" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "向后删除到单词末尾" },

	# 剪切/复制/粘贴
	{ on = "d", run = "delete --cut",                                      desc = "剪切选中字符" },
	{ on = "D", run = [ "delete --cut", "move eol" ],                      desc = "剪切到行尾" },
	{ on = "c", run = "delete --cut --insert",                             desc = "剪切选中字符并进入插入模式" },
	{ on = "C", run = [ "delete --cut --insert", "move eol" ],             desc = "剪切到行尾并进入插入模式" },
	{ on = "s", run = [ "delete --cut --insert", "move 1" ],               desc = "剪切当前字符并进入插入模式" },
	{ on = "S", run = [ "move bol", "delete --cut --insert", "move eol" ], desc = "剪切整行并进入插入模式" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ],         desc = "剪切当前字符" },
	{ on = "y", run = "yank",                                              desc = "复制选中字符" },
	{ on = "p", run = "paste",                                             desc = "在光标后粘贴" },
	{ on = "P", run = "paste --before",                                    desc = "在光标前粘贴" },

	# 撤销/重做/大小写
	{ on = "u",     run = [ "undo", "casefy lower" ], desc = "撤销,或在可视模式下转为小写" },
	{ on = "U",     run = "casefy upper",             desc = "转为大写" },
	{ on = "<C-r>", run = "redo",                     desc = "重做上次操作" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[confirm]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "取消确认" },
	{ on = "<C-[>",   run = "close",          desc = "取消确认" },
	{ on = "<C-c>",   run = "close",          desc = "取消确认" },
	{ on = "<Enter>", run = "close --submit", desc = "确认" },

	{ on = "n", run = "close",          desc = "取消" },
	{ on = "y", run = "close --submit", desc = "确认" },

	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一行" },
	{ on = "<Down>", run = "arrow next", desc = "下一行" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[cmp]

keymap = [
	{ on = "<C-c>",   run = "close",                                      desc = "取消补全" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "确认补全" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "补全并提交输入" },

	{ on = "<A-k>", run = "arrow prev", desc = "上一个补全项" },
	{ on = "<A-j>", run = "arrow next", desc = "下一个补全项" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一个补全项" },
	{ on = "<Down>", run = "arrow next", desc = "下一个补全项" },

	{ on = "<C-p>", run = "arrow prev", desc = "上一个补全项" },
	{ on = "<C-n>", run = "arrow next", desc = "下一个补全项" },

	# 帮助
	{ on = "~",    run = "help", desc = "打开帮助" },
	{ on = "<F1>", run = "help", desc = "打开帮助" },
]

[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "清除过滤或关闭帮助" },
	{ on = "<C-[>", run = "escape", desc = "清除过滤或关闭帮助" },
	{ on = "<C-c>", run = "close",  desc = "关闭帮助" },

	# 导航
	{ on = "k", run = "arrow prev", desc = "上一行" },
	{ on = "j", run = "arrow next", desc = "下一行" },

	{ on = "<Up>",   run = "arrow prev", desc = "上一行" },
	{ on = "<Down>", run = "arrow next", desc = "下一行" },

	# 过滤
	{ on = "f", run = "filter", desc = "过滤帮助条目" },
]
