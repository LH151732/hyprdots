[mgr]
ratio = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
tab_size = 2
max_width = 600
max_height = 900
image_filter = "triangle"
image_quality = 75

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s', desc = "Open", for = "linux" },
]
reveal = [
  { run = 'xdg-open "$(dirname %s)"', desc = "Reveal", for = "linux" },
  { run = 'exiftool %s; echo "Press enter to exit"; read _', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
]
play = [
  { run = 'mpv --force-window %s', orphan = true, for = "unix" },
  { run = 'mediainfo %s; echo "Press enter to exit"; read _', block = true, desc = "Show media info", for = "unix" },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912

[log]
enabled = false
